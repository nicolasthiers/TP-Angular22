<form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>🍔 YummyComponents</h1>
    <p class="subtitle">Connexion à la caisse</p>

    <div class="form-field">
        <label for="login">Identifiant</label>
        <input id="login" type="text" formControlName="login" />
        @if (form.controls.login.touched && form.controls.login.invalid) {
            <span class="field-error">L'identifiant est obligatoire</span>
        }
    </div>
    <div class="form-field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="field-error">Le mot de passe est obligatoire</span>
        }
    </div>

    <button class="btn btn-primary btn-lg" type="submit" [disabled]="loading()">Se connecter</button>

    @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
    }
</form>
